name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            name: linux-x64
          - os: macos-latest
            artifact: macos-arm64
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Cache LLVM tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: llvm-tools-${{ matrix.name }}-${{ hashFiles('scripts/fetch_tools.py') }}
          restore-keys: |
            llvm-tools-${{ matrix.name }}-
      - name: Cache Zig cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            ~/.local/share/zig
            zig-pkg
          key: zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'src/cli/mc.zig') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-
      - name: Fetch tools
        run: just fetch-tools
      - name: Run CI
        run: just ci
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mc-${{ matrix.artifact }}
          path: dist/mc-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  windows:
    name: windows-x64
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Cache LLVM tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: llvm-tools-windows-${{ hashFiles('scripts/fetch_tools.py') }}
          restore-keys: |
            llvm-tools-windows-
      - name: Cache Zig cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/zig
            zig-pkg
          key: zig-cache-windows-${{ hashFiles('build.zig.zon', 'src/cli/mc.zig') }}
          restore-keys: |
            zig-cache-windows-
      - name: Fetch tools
        shell: pwsh
        run: just fetch-tools
      - name: Run CI
        shell: pwsh
        run: just ci
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mc-windows-x64
          path: dist/mc-windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish edge pre-release
    needs: [unix, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mc-*
          path: dist
          merge-multiple: true
      - name: Zip release assets
        run: |
          cd dist
          chmod +x mc-linux-x64 mc-macos-arm64
          mv mc-linux-x64 mc && zip mc-linux-x64.zip mc && rm mc
          mv mc-macos-arm64 mc && zip mc-macos-arm64.zip mc && rm mc
          mv mc-windows-x64.exe mc.exe && zip mc-windows-x64.zip mc.exe && rm mc.exe
          ls -la
      - name: Replace edge pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete edge --yes --cleanup-tag || true
          gh release create edge dist/*.zip \
            --title "mc edge (${GITHUB_SHA::7})" \
            --notes "Automated pre-release built from ${GITHUB_SHA}." \
            --prerelease \
            --target "$GITHUB_SHA"
