name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            name: linux-x64
          - os: macos-latest
            artifact: macos-arm64
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Cache LLVM tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: llvm-tools-${{ matrix.name }}-${{ hashFiles('scripts/fetch_tools.py') }}
          restore-keys: |
            llvm-tools-${{ matrix.name }}-
      - name: Cache Zig cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            ~/.local/share/zig
            zig-pkg
          key: zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'src/cli/mc.zig') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-
      - name: Fetch tools
        run: just fetch-tools
      - name: Run CI
        run: just ci
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mc-${{ matrix.artifact }}
          path: dist/mc-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  windows:
    name: windows-x64
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Cache LLVM tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: llvm-tools-windows-${{ hashFiles('scripts/fetch_tools.py') }}
          restore-keys: |
            llvm-tools-windows-
      - name: Cache Zig cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/zig
            zig-pkg
          key: zig-cache-windows-${{ hashFiles('build.zig.zon', 'src/cli/mc.zig') }}
          restore-keys: |
            zig-cache-windows-
      - name: Fetch tools
        shell: pwsh
        run: just fetch-tools
      - name: Run CI
        shell: pwsh
        run: just ci
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mc-windows-x64
          path: dist/mc-windows-x64.exe
          if-no-files-found: error
          retention-days: 7
