name: Release

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check_changes:
    name: Check if release needed
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect tag & changes
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_STR=$(date +'%Y.%m.%d')
          SHORT_HASH="${GITHUB_SHA::7}"
          TAG_NAME="${DATE_STR}-mc-${SHORT_HASH}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release $TAG_NAME already exists for main HEAD. Skipping scheduled build."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Force build requested via workflow_dispatch."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  unix:
    name: ${{ matrix.name }}
    needs: [check_changes]
    if: needs.check_changes.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            name: linux-x64
          - os: macos-latest
            artifact: macos-arm64
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Cache LLVM tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: llvm-tools-${{ matrix.name }}-${{ hashFiles('scripts/fetch_tools.py') }}
          restore-keys: |
            llvm-tools-${{ matrix.name }}-
      - name: Cache Zig cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            ~/.local/share/zig
            zig-pkg
          key: zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'src/cli/mc.zig') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-
      - name: Fetch tools
        run: just fetch-tools
      - name: Run CI
        run: just ci
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mc-${{ matrix.artifact }}
          path: dist/mc-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  windows:
    name: windows-x64
    needs: [check_changes]
    if: needs.check_changes.outputs.skip != 'true'
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Cache LLVM tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: llvm-tools-windows-${{ hashFiles('scripts/fetch_tools.py') }}
          restore-keys: |
            llvm-tools-windows-
      - name: Cache Zig cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/zig
            zig-pkg
          key: zig-cache-windows-${{ hashFiles('build.zig.zon', 'src/cli/mc.zig') }}
          restore-keys: |
            zig-cache-windows-
      - name: Fetch tools
        shell: pwsh
        run: just fetch-tools
      - name: Run CI
        shell: pwsh
        run: just ci
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mc-windows-x64
          path: dist/mc-windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release Build
    needs: [check_changes, unix, windows]
    if: needs.check_changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mc-*
          path: dist
          merge-multiple: true
      - name: Package release assets
        id: release_info
        run: |
          TAG_NAME="${{ needs.check_changes.outputs.tag }}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

          cd dist
          chmod +x mc-linux-x64 mc-macos-arm64
          mv mc-linux-x64 mc && zip "${TAG_NAME}-linux-x64.zip" mc && rm mc
          mv mc-macos-arm64 mc && zip "${TAG_NAME}-macos-arm64.zip" mc && rm mc
          mv mc-windows-x64.exe mc.exe && zip "${TAG_NAME}-windows-x64.zip" mc.exe && rm mc.exe
          ls -la
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.release_info.outputs.tag }}"
          gh release create "$TAG_NAME" dist/*.zip \
            --title "$TAG_NAME" \
            --notes "Release build $TAG_NAME generated from ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"
