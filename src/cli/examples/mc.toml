# mc.toml — example project configuration for mc (ModC)
# Generated by: mc init
# Docs: https://github.com/nightconcept/mc

[project]
name    = "myproject"
version = "0.1.0"
license = "MIT"
authors = []

[build]
# c_standard   = "c11"          # -std= flag passed to clang tools
# include_dirs = ["include"]    # Directories added as -I flags
# defines      = []             # Preprocessor defines: ["FOO=1", "BAR"]
# sources      = ["src/**/*.c"] # Source files for `mc build` (default: src/**/*.c)
# main         = "src/main.c"   # Explicit main() file, for source trees with more than one
# target       = "bin/myproject" # Output binary path (default: bin/<name>)

[fmt]
# All keys mirror clang-format YAML names exactly.
# Delete this entire [fmt] block to use mc defaults (shown commented below).
#
# BasedOnStyle                     = "LLVM"
# ColumnLimit                      = 120
# IndentWidth                      = 4
# UseTab                           = "Never"
# PointerAlignment                 = "Right"
# BreakBeforeBraces                = "Attach"
# AllowShortFunctionsOnASingleLine = "Inline"
# AlignConsecutiveMacros           = "Consecutive"
# AlignConsecutiveAssignments      = "None"
# AlignConsecutiveDeclarations     = "None"
# SortIncludes                     = "Never"
# IncludeBlocks                    = "Preserve"

[lint]
# Delete this entire [lint] block to use mc defaults (shown commented below).
#
# checks             = "-*, bugprone-*, clang-analyzer-*, readability-*, -bugprone-easily-swappable-parameters, -readability-identifier-length"
# warnings_as_errors = ""
# header_filter      = ".*"

[lsp]
# clangd_args = []   # Extra arguments forwarded verbatim to clangd
